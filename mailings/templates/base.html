{% load static %}
<!doctype html>
<html lang="ru">
  <head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Mailing Service{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/app.css' %}" rel="stylesheet">
    <style>
      body {
        background-color: #eaeaea; /* пепельно-бумажный фон */
      }
    </style>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="/">Mailing</a>
          <div class="ms-auto d-flex gap-2">
            {% if user.is_authenticated %}
              <a class="btn btn-outline-light btn-sm" href="{% url 'users:profile' %}">
                Профиль
              </a>
              <form method="post" action="{% url 'users:logout' %}" class="d-inline">
                {% csrf_token %}
                <button class="btn btn-outline-light btn-sm" type="submit">
                  Выход
                </button>
              </form>
            {% else %}
              <a class="btn btn-outline-light btn-sm" href="{% url 'users:login' %}">
                Вход
              </a>
              <a class="btn btn-primary btn-sm" href="{% url 'users:register' %}">
                Регистрация
              </a>
            {% endif %}
          </div>
      </div>
    </nav>
    <main class="container py-4 flex-fill">
      {% block content %}{% endblock %}
    </main>
    <footer class="mt-auto py-3 bg-dark text-center text-light small">
      {% load tz %}
      <div class="container">
        Mailing Service © {{ now|date:"Y" }} — учебный проект SkyPro™
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
