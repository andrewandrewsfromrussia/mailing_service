{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{{ view.object|default:'Новая рассылка' }}{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ view.object|default:'Новая рассылка' }}</h1>
<form method="post">
  {% csrf_token %}
  {{ form|crispy }}
  <div class="mt-3">
    <button class="btn btn-primary" type="submit">Сохранить</button>
    <a class="btn btn-outline-light" href="{% url 'mailings:mailing_list' %}">Отмена</a>
  </div>
</form>
{% endblock %}
