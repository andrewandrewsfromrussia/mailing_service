{% extends "base.html" %}
{% block title %}Сообщения{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 m-0">Сообщения</h1>
  <a class="btn btn-primary" href="{% url 'mailings:message_create' %}">Добавить</a>
</div>
<table class="table table-dark table-hover table-sm align-middle">
  <thead>
    <tr>
      <th>Тема</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for m in messages %}
    <tr>
      <td>{{ m.subject }}</td>
      <td class="text-end">
        <a class="btn btn-outline-light btn-sm" href="{% url 'mailings:message_update' m.pk %}">Изменить</a>
        <a class="btn btn-danger btn-sm" href="{% url 'mailings:message_delete' m.pk %}">Удалить</a>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="2" class="text-center text-muted">Пока пусто</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
