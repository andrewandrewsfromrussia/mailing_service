{% extends "base.html" %}
{% block title %}Получатели{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 m-0">Получатели</h1>
  <a class="btn btn-primary" href="{% url 'mailings:client_create' %}">Добавить</a>
</div>
<table class="table table-dark table-hover table-sm align-middle">
  <thead>
    <tr>
      <th>Email</th>
      <th>ФИО</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for c in clients %}
    <tr>
      <td>{{ c.email }}</td>
      <td>{{ c.full_name|default:"—" }}</td>
      <td class="text-end">
        <a class="btn btn-outline-light btn-sm" href="{% url 'mailings:client_update' c.pk %}">Изменить</a>
        <a class="btn btn-danger btn-sm" href="{% url 'mailings:client_delete' c.pk %}">Удалить</a>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="3" class="text-center text-muted">Пока пусто</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
